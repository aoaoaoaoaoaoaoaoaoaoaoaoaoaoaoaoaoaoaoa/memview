[package]
name = "memview"
description = "Linux-only ncdu-like TUI for attributing RAM across processes, tmpfs, shm, and kernel counters"
edition.workspace = true
keywords = ["linux", "memory", "procfs", "tmpfs", "tui"]
categories = ["command-line-utilities"]
license.workspace = true
readme = "../../README.md"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/memview"
rust-version.workspace = true
version.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
regex = "1.12.2"
rustix = { version = "1.1.4", features = ["param", "process"] }
uzers = "0.12.2"
walkdir = "2.5.0"

[lints]
workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
